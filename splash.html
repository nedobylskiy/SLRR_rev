<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SLRR REV</title>
<!-- Standalone client splash: a transparent, borderless window showing the project logo
     for about three seconds while game.html loads behind it. No script. -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
    -webkit-user-select: none; user-select: none; cursor: default; }
  body { display: grid; place-items: center; }
  img { width: 100%; height: 100%; object-fit: contain; -webkit-user-drag: none;
    animation: appear .35s ease-out both; }
  @keyframes appear { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <img src="/docs/media/slrr-rev-logo.png" alt="SLRR REV" draggable="false">
</body>
</html>
