[package]
name = "slrr-standalone"
version = "0.1.0"
description = "Standalone SLRR engine client: system webview plus an in-process game resource provider"
edition = "2021"
publish = false

[lib]
# The library form is what Tauri's Android/iOS hosts load.
name = "slrr_standalone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
